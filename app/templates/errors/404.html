<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page non trouvée — PrivateForm</title>
    <link rel="icon" type="image/png" href="/static/img/favicon.png">
    <link rel="stylesheet" href="/static/css/tailwind.min.css">
    <style nonce="{{ request.state.csp_nonce }}">
        .pf-gradient-text {
            background: linear-gradient(135deg, #5FD4C4 0%, #4B8FDB 50%, #6B7FDB 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans flex items-center justify-center min-h-screen">
    <div class="text-center px-6">
        <h1 class="text-8xl font-bold pf-gradient-text mb-4">404</h1>
        <p class="text-gray-500 text-lg mb-2">Page non trouvée</p>
        <p class="text-gray-400 text-sm mb-8">La page que vous recherchez n'existe pas ou a été déplacée.</p>
        <a href="/" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg font-medium text-sm transition-colors">
            Retour à l'accueil
        </a>
        <div class="mt-12">
            <img src="/static/img/logo.png" alt="PrivateForm" class="h-8 mx-auto opacity-40">
        </div>
    </div>
</body>
</html>
