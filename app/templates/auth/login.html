{% extends "base/layout.html" %}

{% block title %}Se connecter — PrivateForm{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-10 px-4">
    <div class="w-full max-w-md">

        <!-- Header -->
        <div class="text-center mb-8">
            <img src="/static/img/logo.png" alt="PrivateForm" class="h-14 mx-auto mb-3">
            <h1 class="text-2xl font-bold text-gray-800">Se connecter</h1>
            <p class="text-gray-500 text-sm mt-1">Pas de compte ? <a href="/register" class="text-blue-600 hover:underline">S'inscrire</a></p>
        </div>

        <!-- Form -->
        <form method="POST" action="/login" class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 space-y-5">

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required autofocus
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-blue-500">
            </div>

            <!-- Mot de passe -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Mot de passe</label>
                <input type="password" id="password" name="password" required
                       class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:border-blue-500">
            </div>

            <!-- Error message (generic) -->
            {% if error %}
            <div class="bg-red-50 border border-red-200 text-red-600 text-sm rounded-lg px-4 py-3">
                {{ error }}
            </div>
            {% endif %}

            <!-- Recovery link -->
            <div class="text-right -mt-2">
                <a href="/forgot-password" class="text-blue-600 text-sm hover:underline">Mot de passe oublié ?</a>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-primary w-full py-2.5 rounded-lg font-semibold text-sm">
                Se connecter
            </button>
        </form>
    </div>
</div>

<script nonce="{{ request.state.csp_nonce }}">
(function() {
    // Execute immediately
    function setupEnterSubmit() {
        const form = document.querySelector('form[action="/login"]');
        if (!form) {
            // If form doesn't exist yet, retry in 50ms
            setTimeout(setupEnterSubmit, 50);
            return;
        }
        
        form.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                e.preventDefault();
                form.submit();
            }
        });
    }
    
    setupEnterSubmit();
})();
</script>

{% endblock %}
