[tool.poetry]
name = "privateform"
version = "0.1.0"
description = "PrivateForm - Formulaires médicaux sécurisés et privés"
authors = ["Arrakis <privateform@arrakis.lu>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
sqlalchemy = "^2.0.0"
alembic = "^1.14.0"
psycopg2-binary = "^2.9.0"
pydantic-settings = "^2.0.0"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
jinja2 = "^3.1.0"
python-multipart = "^0.0.20"
fpdf2 = "^2.7.0"
pypdf = "^5.1.0"
aiosmtplib = "^2.0.0"
qrcode = {version = "^8.0.0", extras = ["pil"]}
Pillow = "^11.0.0"
python-dotenv = "^1.0.0"
httpx = "^0.28.0"
pytz = "^2024.0"

[tool.poetry.dev-dependencies]
# Dev dependencies if needed in the future

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
