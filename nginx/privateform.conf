# =============================================================================
# PrivateForm - Nginx Server Block
# =============================================================================
# IMPORTANT: Before using the HTTPS section, you must obtain the certificates
# Let's Encrypt using the script scripts/setup_ssl.sh
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP - Redirects to HTTPS (except Let's Encrypt path)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name privateform.arrakis.lu;

    # Let's Encrypt Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS - Main configuration
# -----------------------------------------------------------------------------
# NOTE: This section is activated AFTER obtaining SSL certificates.
# Commented by default. Once you have the certs, uncomment and adjust.
# -----------------------------------------------------------------------------

 server {
     listen 443 ssl;
     server_name privateform.arrakis.lu;

     # Let's Encrypt Certificates
     ssl_certificate /etc/letsencrypt/live/privateform.arrakis.lu/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/privateform.arrakis.lu/privkey.pem;
     # ssl_options /etc/letsencrypt/options-ssl-nginx.conf;
     # include /etc/letsencrypt/options-ssl-nginx.conf;
     # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

     # Additional security headers
     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

     # Static files served directly by Nginx
     location /static/ {
         alias /usr/share/nginx/html/static/;
         expires 30d;
         add_header Cache-Control "public, immutable";
     }

    # Proxy to FastAPI application
     location / {
         proxy_pass http://app:8000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection 'upgrade';
         proxy_cache_bypass $http_upgrade;
     }
 }
