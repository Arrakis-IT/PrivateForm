# =============================================================================
# PrivateForm - Nginx Server Block
# =============================================================================
# IMPORTANT: Before using the HTTPS section, you must obtain the certificates
# Let's Encrypt using the script scripts/setup_ssl.sh
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP - Redirects to HTTPS (except Let's Encrypt path)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name privateform.arrakis.lu;

    # Let's Encrypt Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else redirects to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS - Main configuration
# -----------------------------------------------------------------------------
# NOTE: This section is activated AFTER obtaining SSL certificates.
# Commented by default. Once you have the certs, uncomment and adjust.
# -----------------------------------------------------------------------------

 server {
     listen 443 ssl;
     server_name privateform.arrakis.lu;

     # Let's Encrypt Certificates
     ssl_certificate /etc/letsencrypt/live/privateform.arrakis.lu/fullchain.pem;
     ssl_certificate_key /etc/letsencrypt/live/privateform.arrakis.lu/privkey.pem;

     # TLS hardening
     ssl_protocols TLSv1.2 TLSv1.3;
     ssl_prefer_server_ciphers off;
     ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305";
     ssl_session_cache shared:SSL:10m;
     ssl_session_timeout 1d;
     ssl_session_tickets off;

     # Additional security headers
     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

     # Static files served directly by Nginx
     location /static/ {
         alias /usr/share/nginx/html/static/;
         expires 30d;
         add_header Cache-Control "public, immutable";
     }

    # Cloudflare real IP restoration
    # Tells nginx to trust CF-Connecting-IP from Cloudflare IP ranges
    # so $remote_addr becomes the real client IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;


    # Rate-limited endpoints
    location = /login {
        limit_req zone=pf_login burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /register {
        limit_req zone=pf_login burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/f/[^/]+/submit$ {
        limit_req zone=pf_submit burst=5 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy to FastAPI application
     location / {
         proxy_pass http://app:8000;
         proxy_set_header Host $host;
         proxy_set_header X-Real-IP $remote_addr;
         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
         proxy_set_header X-Forwarded-Proto $scheme;
         proxy_http_version 1.1;
         proxy_set_header Upgrade $http_upgrade;
         proxy_set_header Connection 'upgrade';
         proxy_cache_bypass $http_upgrade;
     }
 }
