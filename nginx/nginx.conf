# =============================================================================
# PrivateForm - Nginx main settings
# =============================================================================

worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" $request_time';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Security - hide nginx version
    # Security headers are set by FastAPI middleware to avoid duplicates
    server_tokens off;

    # HSTS (only if HTTPS is enabled)
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Rate limiting zones (first line of defense against volumetric attacks)
    # FastAPI has stricter per-email/per-IP limits; nginx blocks floods before they reach Python
    limit_req_zone $binary_remote_addr zone=pf_login:10m    rate=20r/m;
    limit_req_zone $binary_remote_addr zone=pf_submit:10m   rate=10r/m;
    limit_req_status 429;

    # Maximum body size (1 MB, depending on settings)
    client_max_body_size 1m;

    # Include server settings
    include /etc/nginx/conf.d/*.conf;
}
