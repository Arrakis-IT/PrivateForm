# =============================================================================
# PrivateForm - Alembic Configuration
# =============================================================================

[alembic]
# Ruta al script env.py de migración
script_location = migrations

# URL de conexión (se sobreescribe desde env.py usando settings)
sqlalchemy.url = postgresql://user:pass@localhost/privateform_db

# Opciones de template
file_template = %%(rev)s_%%(slug)s

# Logging
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
